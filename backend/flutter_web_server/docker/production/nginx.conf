# Serverpod Admin 生产环境 Nginx（容器内 /etc/nginx/nginx.conf）
# 只对外暴露两个入口：/web/ 是前端（../../web 挂载的 dist），/api/ 反代到 webServer 8082
# 根路径与其它路径一律 404

worker_processes auto;

# 日志走容器 stdout/stderr：docker logs 能看，轮转交给 compose 的 max-size
error_log stderr warn;
pid /var/run/nginx.pid;

events {
    accept_mutex on;
    multi_accept on;
    use epoll;
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ==================== 基础优化 ====================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 50m;
    server_tokens off;

    # ==================== 日志 ====================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    '$request_time $upstream_response_time';

    # 不加 buffer：写 buffer 会让 docker logs 延迟 5s，且进程退出时可能丢最后几行
    access_log /dev/stdout main;

    # ==================== Gzip ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        image/x-icon;

    # ==================== 安全头 ====================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ==================== 限流 ====================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ==================== HTTP -> HTTPS ====================
    server {
        listen 80;
        server_name a.app.yizhuanyiyuan.cn;
        return 301 https://$server_name$request_uri;
    }

    # ==================== HTTPS ====================
    server {
        listen 443 ssl;
        http2 on;
        server_name a.app.yizhuanyiyuan.cn;

        ssl_certificate     /etc/nginx/ssl/server.pem;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 前台挂在 /web/ 下，根路径和其它路径一律 404
        location = /web { return 301 /web/; }

        # 带 hash 的构建产物长缓存；此处 add_header 会覆盖 server 级安全头，静态资源无所谓
        location /web/assets/ {
            alias /usr/share/nginx/html/web/dist/assets/;
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }

        location /web/ {
            alias /usr/share/nginx/html/web/dist/;
            index index.html;
            try_files $uri $uri/ /web/index.html;
        }

        location / {
            return 404;
        }

        # 安装包上传：APK 通常 60-150MB，全局 50m 不够；关掉请求缓冲直接透传
        location = /api/app/release/upload {
            client_max_body_size 300m;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_pass http://apiServer:8082/api/app/release/upload;
        }

        # 安装包下载：流式回包，不落 nginx 临时文件，保留 Range/206
        location /api/app/update/download/ {
            proxy_buffering off;
            proxy_max_temp_file_size 0;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            proxy_pass http://apiServer:8082/api/app/update/download/;
        }

        # REST 接口 → webServer 8082（前端 VITE_API_PREFIX=/api，不能指向 8080）
        location /api/ {
            limit_req zone=api_limit burst=60 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://apiServer:8082/api/;
            proxy_http_version 1.1;
            # 绝不能给上游发 Connection: upgrade —— dart:io 见到这个 token 就当协议升级，
            # 直接关掉请求体，POST body 全丢（表现为 40400「username 不能为空」）
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ==================== 错误页面 ====================
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
