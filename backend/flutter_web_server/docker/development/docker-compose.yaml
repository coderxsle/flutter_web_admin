# 开发环境：只起基础设施，Dart 进程跑在宿主机（dev nginx 用 host.docker.internal 回指）
# 端口 8090/8091 故意错开，避免和本机已有的 postgres/redis 抢 5432/6379
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: serverpod-dev-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-8090}:5432'
    env_file:
      - ../../.env/.env.development
    environment:
      # start.sh 会从这个文件里 grep 库名，这行别删
      POSTGRES_DB: serverpod
      POSTGRES_USER: postgres
      TZ: ${TIMEZONE:-Asia/Shanghai}
      PGTZ: ${TIMEZONE:-Asia/Shanghai}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - serverpod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serverpod"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:6.2.6
    container_name: serverpod-dev-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-8091}:6379'
    env_file:
      - ../../.env/.env.development
    environment:
      REDIS_REPLICATION_MODE: master
    # 密码只从 env_file 取，不写死在文件里
    command: >
      sh -c 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.25
    container_name: serverpod-dev-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_PORT:-80}:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  serverpod_data:
  redis_data:
