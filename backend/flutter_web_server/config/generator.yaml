type: server

# 已弃用 typed Endpoint + typed 客户端：不再生成 client / server_test_tools。
# 全部接口走 REST 表现层（`lib/src/web/routes/api/`，8082 的 `/api/**`）。

# 2026-09-26：原 extraClasses 把 flutter_web_shared 的三个手写响应类
# （BaseResponse / CommonResponse / PageResponse）注册进协议，供 RPC 当返回类型用。
# RPC 已弃用，故一并移除 —— 它们现在是 `lib/src/common/` 下的普通 Dart 类。
# 2026-09-26：serverpod_crud 是纯 Dart 框架包（lib/src/models 下只剩模板残留的
# test.spy.yaml），列在这里会让每次 generate 都重写它的 lib/src/generated/。
shared_packages: []

# 模块的别名将决定客户端如何引用该模块。
# 可以选择性地添加 serverpod_auth_idp 模块并为其指定一个别名nickname。
# 如果模块未添加到 config/generator.yaml 则将使用该模块的默认别名。
modules:
  serverpod_auth_idp:
    nickname: auth_idp
  serverpod_auth_core:
    nickname: auth_core

# 可用的实验功能：
# inheritance：
# all：启用所有可用的实验功能
experimental_features:
  inheritance: true # Enables class inheritance in model files
  # or
  all: true # Enables all experimental features