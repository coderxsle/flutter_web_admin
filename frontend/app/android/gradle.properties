android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8 -Dhttps.protocols=TLSv1.2
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=12
org.gradle.vfs.watch=true
org.gradle.caching=true

#systemProp.https.protocols=TLSv1.2
#systemProp.http.agent=Mozilla/5.0
#systemProp.http.keepAlive=true
#systemProp.http.maxConnections=10

# 启用 TLSv1.3（适用于 JDK 8u261+、JDK 11+ 等支持 TLSv1.3 的版本）
systemProp.https.protocols=TLSv1.2,TLSv1.3

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
