### 中医门诊账单（兼容 FastapiAdmin zhongyi_bill）
class: ZhongyiBill
table: zhongyi_bill
fields:
  ### 租户ID
  tenantId: int, default = 0
  ### 账单编号
  billNo: String
  ### 患者ID
  patientId: int
  ### 挂号ID
  registrationId: int?
  ### 病历ID
  medicalRecordId: int?
  ### 收费阶段
  billingStage: String
  ### 总金额
  totalAmount: double, default = 0.0
  ### 已付金额
  paidAmount: double, default = 0.0
  ### 已退金额
  refundedAmount: double, default = 0.0
  ### 优惠金额
  discountAmount: double?
  ### 优惠原因
  discountReason: String?
  ### 支付状态
  paymentStatus: String, default = 'unpaid'
  ### 账单状态（0取消，1正常）
  status: int, default = 1
  ### 收银员ID
  cashierId: int?
  ### 支付完成时间
  paidAt: DateTime?
  ### 备注
  notes: String?
  ### 描述
  description: String?
  ### 是否删除
  deleted: bool, default = false
  ### 创建人
  creator: String?
  ### 创建时间
  createTime: DateTime, default = now
  ### 更新人
  updater: String?
  ### 更新时间
  updateTime: DateTime, default = now

indexes:
  zhongyi_bill_no_unique:
    fields: billNo
    unique: true
  zhongyi_bill_patient_time_idx:
    fields: tenantId, patientId, createTime
