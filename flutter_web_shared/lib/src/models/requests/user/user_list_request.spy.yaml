### 用户列表查询请求参数
class: UserListRequest
fields:
  tenantId: int?, default = 0
  deptId: int?
  ### 关键词检索：OR 命中 username / nickname / phone（前端单搜索框用）。
  keyword: String?
  username: String?
  nickname: String?
  phone: String?
  email: String?
  ### 帐号状态（0=禁用，1=正常）。**留空 = 不过滤**，能同时看到正常 + 禁用用户。
  status: String?
  ### 服务端分页参数：page 从 1 开始，pageSize 上限由服务端收敛为 100
  page: int?, default = 1
  pageSize: int?, default = 10
